aid: corsair-pharma
name: Corsair Pharma
description: 'Corsair Pharma, Inc. is a privately held clinical-stage biopharmaceutical
  company developing proprietary prodrugs of treprostinil for the treatment of pulmonary
  arterial hypertension (PAH). Its lead program, the TRX-248 transdermal system, is
  an investigational once-daily patch that delivers an inactive treprostinil prodrug
  across the skin for conversion to active drug in the liver, aiming to combine the
  efficacy and titration profile of parenteral prostacyclin therapy with non-invasive
  once-daily dosing. The company completed its preclinical program, announced positive
  Phase 1 results for TRX-248 in June 2026, closed a $23M Series B led by New Rhein
  Healthcare Investors, and has entered a strategic collaboration with United Therapeutics
  to advance novel treprostinil prodrugs. Corsair Pharma is a drug developer, not a
  software vendor: its public web presence is a five-page marketing and investor-news
  site with no developer program, API, SDK, or machine-readable specification of any
  kind.'
