generated: '2026-08-11'
method: probed
source: https://www.corsairpharma.com/
host: https://www.corsairpharma.com

# NOTE: no pointer is wired into apis.yml for this file. Nothing here returned a real
# document, so emitting a `WellKnown` or `SecurityTxt` pointer would assert that Corsair
# Pharma serves a discovery surface it does not serve.
#
# The live host sits behind a SiteGround "Robot Challenge Screen" that answers EVERY
# path -- including /robots.txt and a deliberately nonsensical control path -- with
# HTTP 202 and a 169-198 byte HTML meta-refresh to /.well-known/sgcaptcha/. A 202 here
# is therefore NOT evidence that a path exists; it is the challenge, not the document.
# Absence was instead confirmed against Wayback Machine captures, which recorded honest
# 404s on the same paths in 2024 before the challenge was enabled.

challenge:
  present: true
  vendor: SiteGround
  type: bot-challenge
  title: Robot Challenge Screen
  status: 202
  redirects_to: /.well-known/sgcaptcha/
  catch_all: true
  control_path: /zzz-api-evangelist-control-8614
  control_status: 202
  note: >-
    Control path returned the identical 202 challenge, proving the response is a
    catch-all and carries no information about whether a path exists. Challenge was
    not solved or evaded.

